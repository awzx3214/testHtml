(function initGlobalNationalDayClipboard() {
    // global-national-day-clipboard-v1
    const forceClipboardEnabled = false;
    if (!forceClipboardEnabled) return;

    if (previewMode) return;

    const pool = window.NationalDayCopyPool;
    if (!pool || typeof pool.generate !== 'function') return;

    let copied = false;
    let copying = false;
    let toastShown = false;

    function showCopiedToast() {
        if (toastShown || !document.body) return;
        toastShown = true;
        const toast = document.createElement('div');
        toast.textContent = '国庆祝福语已复制';
        toast.style.cssText = [

            'left:50%',

            'white-space:nowrap',
            'pointer-events:none',
            'box-shadow:0 4px 16px rgba(0,0,0,.2)'
        ].join(';');
        document.body.appendChild(toast);
        setTimeout(function () {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 1800);
    }

    function legacyCopy() {
        const textarea = document.createElement('textarea');
        textarea.value = blessingText;
        textarea.setAttribute('readonly', 'readonly');
        textarea.setAttribute('aria-hidden', 'true');
        textarea.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;font-size:16px;';
        document.body.appendChild(textarea);
        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, blessingText.length);
        let success = false;
        try {
            success = document.execCommand('copy');
        } catch (error) {}
        document.body.removeChild(textarea);
        return success;

    function finishCopy(success) {
        copying = false;
        if (!success) return false;
        copied = true;
        document.documentElement.setAttribute('data-national-day-clipboard', 'copied');
        showCopiedToast();
        unbindFirstGesture();
        return true;
    }

    function copyBlessing() {
        if (copied || copying || !document.body) {
            return Promise.resolve(copied);
        }
        copying = true;

        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(blessingText)

        try {

            if (nid && !miniQuery.get('fromHost')) {

            if (miniQuery.toString()) {
                parsed.searchParams.set('query', miniQuery.toString());

            return parsed.toString().replace(/([?&]path=)([^&]+)/, function (_, prefix, value) {
                try {
                    return prefix + decodeURIComponent(value);

    function isMiniProgramEnv() {
        return new Promise((resolve) => {
            let finished = false;

            const done = (value) => {
                if (finished) return;
                finished = true;
                resolve(!!value);
            };

            try {
                if (typeof wx === "undefined" || !wx.miniProgram) {
                    return done(false);
                }

                const timer = setTimeout(() => done(false), 800);

                wx.miniProgram.getEnv((res) => {
                    clearTimeout(timer);
                    done(!!(res && res.miniprogram));
                });
            } catch (e) {
                done(false);
            }
        });
    }

        if (shouldHideButtons() && hasMiniProgramBridge()) {
            return true;
        }

        return false;
    }

    function safePlayOuterMusic() {
        if (outerMusicDisabled || isTvTemplate()) return;
        if (innerPrimaryMediaActive) return;
        if (!music || (!music.src && !outerMusicUrl && !outerVoiceUrl)) return;

        if (outerVoiceInProgress && outerVoiceUrl && isSameMediaUrl(music.currentSrc || music.src, outerVoiceUrl)) {
            logHekaVoiceDebug('resumeVoiceInProgress');
            try {
                const resumeVoice = music.play();
                if (resumeVoice && typeof resumeVoice.catch === 'function') {
                    resumeVoice.catch(() => {});
                }
            } catch (e) {}
            updateMusicBtnState();
            return;
        }

        const retryPlayOnce = function () {
            if (innerPrimaryMediaActive) return;
            try {
                const retry = music.play();
                if (retry && typeof retry.catch === 'function') {
                    retry.catch(() => {});
                }
            } catch (e) {}
            updateMusicBtnState();
        };

        const playUrl = function (url, loop) {
            if (!url) return null;
            if (music.src !== url) {
                music.src = url;
                try { music.load(); } catch (e) {}
            }
            music.volume = 1;
            music.loop = !!loop;
            logHekaVoiceDebug('playUrl', {
                playUrl: url,
                playLoop: !!loop
            });
            return music.play();
        };

        try {
            if (outerVoiceUrl && outerVoiceMode === 'loop') {
                const voiceLoop = playUrl(outerVoiceUrl, true);
                if (voiceLoop && typeof voiceLoop.catch === 'function') {
                    voiceLoop.catch(() => {
                        try {
                            music.addEventListener('canplay', retryPlayOnce, { once: true });
                            music.load();
                        } catch (e) {}
                    });
                }
                updateMusicBtnState();
                return;
            }

            if (outerVoiceUrl && !outerVoicePlayed) {
                outerVoiceInProgress = true;
                music.onended = function () {
                    music.onended = null;
                    outerVoiceInProgress = false;
                    logHekaVoiceDebug('voiceEndedBeforeBg');
                    if (outerMusicUrl) {
                        try {
                            const bg = playUrl(outerMusicUrl, true);
                            if (bg && typeof bg.catch === 'function') bg.catch(() => {});
                        } catch (e) {}
                    }
                    updateMusicBtnState();
                };
                const voiceOnce = playUrl(outerVoiceUrl, false);
                if (voiceOnce && typeof voiceOnce.catch === 'function') {
                    voiceOnce.catch(() => {
                        outerVoiceInProgress = false;
                        logHekaVoiceDebug('voicePlayRejected', {
                            reason: 'promise-rejected'
                        });
                        try {
                            music.addEventListener('canplay', retryPlayOnce, { once: true });
                            music.load();
                        } catch (e) {}
                    });
                }
                updateMusicBtnState();
                return;
            }

            const p = playUrl(outerMusicUrl, true);
            if (p && typeof p.catch === 'function') {
                p.catch(() => {
                    logHekaVoiceDebug('musicPlayRejected', {
                        reason: 'promise-rejected'
                    });
                    try {
                        music.addEventListener('canplay', retryPlayOnce, { once: true });
                        music.load();
                    } catch (e) {}
                });
            }
        } catch (e) {}
        updateMusicBtnState();
    }

    function safePauseOuterMusic() {
        if (!music) return;
        try { music.pause(); } catch (e) {}
        updateMusicBtnState();
    }

    function isInnerPrimaryMedia(player) {
        if (!player || !player.tagName) return false;
        const tagName = String(player.tagName).toLowerCase();
        const mediaUrl = getUsableInnerMediaUrl(player);
        if ((tagName === 'audio' || tagName === 'video') && !mediaUrl) {
            return false;
        }
        // 模板可能用一次性 audio 播放与外层相同的歌曲，也必须暂停外层播放器。
        if (tagName === 'audio' && isSameMediaUrl(mediaUrl, outerMusicUrl)) {
            return true;
        }
        const hint = [
            player.id,
            player.className,
            player.getAttribute && player.getAttribute('name'),
            player.getAttribute && player.getAttribute('data-role'),
            player.getAttribute && player.getAttribute('aria-label')
        ].map(function (value) { return String(value || ''); }).join(' ').toLowerCase();
        const looksLikeMusic = /(^|[^a-z0-9])(bgm|music|soundtrack|background[-_ ]?(music|audio))([^a-z0-9]|$)/.test(hint);

        if (tagName === 'audio') return !!player.loop || looksLikeMusic;
        if (tagName === 'video') return !player.muted && looksLikeMusic;
        return false;
    }

    function refreshInnerPrimaryMediaState() {
        innerPrimaryMediaPlayers.forEach(function (player) {
            try {
                if (!player || !player.isConnected || player.paused || player.ended) {
                    innerPrimaryMediaPlayers.delete(player);
                }
            } catch (e) {
                innerPrimaryMediaPlayers.delete(player);
            }
        });
        innerPrimaryMediaActive = innerPrimaryMediaPlayers.size > 0;
    }

    function bindIframePrimaryMediaGuard() {
        if (!myFrame) return;

        let frameDocument = null;
        try {
            frameDocument = myFrame.contentDocument || (myFrame.contentWindow && myFrame.contentWindow.document);
        } catch (e) {
            return;
        }
        if (!frameDocument || frameDocument.__hekaPrimaryMediaGuardBound) return;
        frameDocument.__hekaPrimaryMediaGuardBound = true;
        innerPrimaryMediaPlayers.clear();
        innerPrimaryMediaActive = false;

        const handlePlay = function (event) {
            const player = event && event.target;
            if (!isInnerPrimaryMedia(player)) return;
            innerPrimaryMediaPlayers.add(player);
            innerPrimaryMediaActive = true;
            safePauseOuterMusic();
            logHekaVoiceDebug('innerPrimaryMedia:play', {
                innerTag: String(player.tagName || '').toLowerCase(),
                innerId: player.id || ''
            });
        };
        const handleStop = function (event) {
            const player = event && event.target;
            if (!player || (!innerPrimaryMediaPlayers.has(player) && !isInnerPrimaryMedia(player))) return;
            const wasActive = innerPrimaryMediaPlayers.has(player);
            innerPrimaryMediaPlayers.delete(player);
            refreshInnerPrimaryMediaState();
            if (wasActive && !innerPrimaryMediaActive && outerMusicUrl) {
                safePlayOuterMusic();
            }
        };

        frameDocument.addEventListener('play', handlePlay, true);
        frameDocument.addEventListener('pause', handleStop, true);
        frameDocument.addEventListener('ended', handleStop, true);
        frameDocument.addEventListener('emptied', handleStop, true);
        frameDocument.addEventListener('error', handleStop, true);
        frameDocument.addEventListener('abort', handleStop, true);

        try {
            frameDocument.querySelectorAll('audio,video').forEach(function (player) {
                if (isInnerPrimaryMedia(player) && !player.paused && !player.ended) {
                    handlePlay({ target: player });
                }
            });
        } catch (e) {}
    }

    function bindH5MakeLink() {

            if (!window.templateData || !window.templateData.jump_make) return;
            stopOuterPlayback('h5 make link');

            const jumpByScheme = function () {

            };

            if (!shouldUseMiniProgramInternalMake()) {

                let envChecked = false;
                const finishByEnv = function (isMiniProgram) {
                    if (envChecked) return;
                    envChecked = true;

                    if (isMiniProgram) {
                        ensureMiniProgramButtons();
                        if (makeBtn && typeof makeBtn.click === 'function') {
                            makeBtn.click();
                        }
                        return;
                    }

                    jumpByScheme();
                };

                const envTimer = setTimeout(function () {
                    finishByEnv(forceMiniProgramView || hasMiniProgramRuntimeFlag());
                }, 600);

                wx.miniProgram.getEnv(function (res) {
                    clearTimeout(envTimer);
                    finishByEnv(!!(res && res.miniprogram));
                });
                return;
            }

            if (hasMiniProgramRuntimeFlag()) {
                ensureMiniProgramButtons();
                if (makeBtn && typeof makeBtn.click === 'function') {
                    makeBtn.click();
                }
                return;
            }

            jumpByScheme();
        });
    }

    function bindMusicBtn() {
        if (!musicBtn || !music) return;

        musicBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            if (outerMusicDisabled || isTvTemplate()) return;
            if (!music.src && !outerMusicUrl && !outerVoiceUrl) return;

            if (music.paused) {
                safePlayOuterMusic();
            } else {
                safePauseOuterMusic();
            }
        });

        music.addEventListener('play', updateMusicBtnState);
        music.addEventListener('pause', updateMusicBtnState);
        music.addEventListener('ended', updateMusicBtnState);
    }

    function getPageViewVisitorId() {
        const storageKey = 'page_view_visitor_id_v1';
        try {
            let visitorId = localStorage.getItem(storageKey) || '';
            if (/^[A-Za-z0-9_-]{12,80}$/.test(visitorId)) return visitorId;

            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                visitorId = 'pv_' + window.crypto.randomUUID().replace(/-/g, '');
            } else {
                visitorId = 'pv_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 18);
            }
            localStorage.setItem(storageKey, visitorId);
            return visitorId;
        } catch (e) {
            return '';
        }
    }

    function reportPageView(nid) {
        if (!nid) return;
        if (Number((window.templateData || {}).pageViewStatsEnabled || 0) !== 1) return;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        const visitorId = getPageViewVisitorId();

        fetch(`/api/addView?nid=${encodeURIComponent(nid)}`, {
            method: 'GET',
            headers: visitorId ? {'X-Page-Visitor': visitorId} : {},
            signal: controller.signal
        })
        .then(res => res.json())
        .then(res => {
            clearTimeout(timeoutId);

            if (res.code === 200 && typeof res.views === 'number') {
                window.templateData.views = res.views;
                syncTemplateDataToStorage();

                if (myFrame && myFrame.contentWindow) {
                    postMessageToTemplate({
                        type: 'updateViews',
                        views: res.views
                    });
                }
            }
        })
        .catch(() => {
            clearTimeout(timeoutId);
        });
    }

    function postTemplateDataToIframe() {
        if (!myFrame || !myFrame.contentWindow) return;
        try {
            postMessageToTemplate({
                type: 'templateData',
                data: window.templateData || {}
            });
        } catch (e) {}
    }

    function bindIframeLoad() {
        if (!myFrame) return;

        myFrame.addEventListener('load', function () {
            templateFrameReady = false;
            bindIframePrimaryMediaGuard();
            syncTemplateDataToStorage();
            postTemplateDataToIframe();
            scheduleTemplateReadyProbe();
            if (templateOpenRequested) {
                sendTemplateOpenSignal();
            }
            if (isBarrage3dTemplate()) {
                postMessageToTemplate({ type: 'barrage3dReadyRequest' });
            }
        });
        setTimeout(bindIframePrimaryMediaGuard, 0);
        setTimeout(bindIframePrimaryMediaGuard, 500);
    }

    function bindMessageBridge() {
        window.addEventListener('message', function (event) {
            if (!isMessageFromTemplate(event)) return;
            const msg = event.data;
            if (!msg) return;

            if (typeof msg === 'object') {
                if (msg.type === 'templateReady') {
                    templateFrameReady = true;
                    clearTemplateReadyProbes();
                    postTemplateDataToIframe();
                    if (templateOpenRequested) {
                        sendTemplateOpenSignal();
                    }
                    return;
                }

                if (msg.type === 'barrage3dReady') {
                    barrage3dReady = true;
                    if (barrage3dOpenPending) finishOpenAction();
                    return;
                }

                const requestedMusic = firstNotEmpty([
                    msg.music,
                    msg.musicUrl,
                    msg.music_url
                ]);
                if (requestedMusic) {
                    outerMusicDisabled = false;
                    outerMusicUrl = String(requestedMusic).trim();
                }

            }

            if (msg === 'requestTemplateData') {
                postTemplateDataToIframe();
                return;
            }

            if (
                msg === 'triggerOpen' ||
                msg === 'innerUserOpenPlayMusic' ||
                msg === 'innerAutoPlayMusic' ||
                msg === 'retryOuterMusic' ||
                msg === 'playOuterMusic'
            ) {
                safePlayOuterMusic();
                return;
            }

            if (typeof msg === 'object') {
                if (msg.type === 'requestTemplateData') {
                    postTemplateDataToIframe();
                    return;
                }

                if (
                    msg.type === 'triggerOpen' ||
                    msg.type === 'innerUserOpenPlayMusic' ||
                    msg.type === 'innerAutoPlayMusic' ||
                    msg.type === 'showBtn' ||
                    msg.type === 'retryOuterMusic' ||
                    msg.type === 'playOuterMusic'
                ) {
                    safePlayOuterMusic();
                    try {
                        if (typeof WeixinJSBridge !== 'undefined') {
                            WeixinJSBridge.invoke('getNetworkType', {}, safePlayOuterMusic);
                        }
                    } catch (e) {}
                    return;
                }

                if (msg.type === 'syncStorage') {
                    syncTemplateDataToStorage();
                    return;
                }
            }
        });
        if (isBarrage3dTemplate()) {
            postMessageToTemplate({ type: 'barrage3dReadyRequest' });
        }
        scheduleTemplateReadyProbe();
    }

    function bindPlaybackLifecycle() {
        if (music && !music.__hekaDebugBound) {
            music.__hekaDebugBound = true;
            music.addEventListener('play', function () {
                if (innerPrimaryMediaActive) {
                    try { music.pause(); } catch (e) {}
                    updateMusicBtnState();
                    return;
                }
                if (outerVoiceUrl && isSameMediaUrl(music.currentSrc || music.src, outerVoiceUrl)) {
                    outerVoicePlayed = true;
                    outerVoiceInProgress = true;
                }
                logHekaVoiceDebug('audioEvent:play');
            });
            music.addEventListener('pause', function () {
                logHekaVoiceDebug('audioEvent:pause');
            });
            music.addEventListener('ended', function () {
                if (outerVoiceUrl && isSameMediaUrl(music.currentSrc || music.src, outerVoiceUrl)) {
                    outerVoiceInProgress = false;
                }
                logHekaVoiceDebug('audioEvent:ended');
            });
            music.addEventListener('error', function () {
                let code = '';
                try {
                    code = music.error && music.error.code;
                } catch (e) {}
                if (outerVoiceUrl && isSameMediaUrl(music.currentSrc || music.src, outerVoiceUrl)) {
                    outerVoiceInProgress = false;
                }
                logHekaVoiceDebug('audioEvent:error', {
                    audioErrorCode: code
                });
            });
            music.addEventListener('loadedmetadata', function () {
                logHekaVoiceDebug('audioEvent:loadedmetadata', {
                    duration: music.duration
                });
            });
            music.addEventListener('canplay', function () {
                logHekaVoiceDebug('audioEvent:canplay');
            });
        }

        window.addEventListener('pagehide', function () {
            stopOuterPlayback('pagehide');
        });
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopOuterPlayback('visibility hidden');
            }
        });
    }

    function isOuterMusicPlaying() {
        return !!(music && !music.paused && !music.ended);
    }

    function isOuterOpenPending() {
        const openBox = document.querySelector('.open-box');
        if (!openBox) return false;
        const style = window.getComputedStyle(openBox);
        return style.display !== 'none'
            && style.visibility !== 'hidden'
            && Number(style.opacity || 1) !== 0;
    }

    function tryForceOuterAutoPlay() {
        if (outerMusicDisabled || isTvTemplate()) return;
        if (innerPrimaryMediaActive) return;
        if (isOuterOpenPending()) return;
        if (!outerMusicUrl && !outerVoiceUrl) return;
        if (isOuterMusicPlaying()) return;
        safePlayOuterMusic();
    }

    function bindWeChatForceAutoPlay() {
        const run = function () {
            tryForceOuterAutoPlay();
            setTimeout(function () {
                if (!isOuterMusicPlaying()) tryForceOuterAutoPlay();
            }, 500);
        };

        try {
            if (typeof wx !== 'undefined' && wx.ready) {
                wx.ready(run);
            }
        } catch (e) {}

        try {
            if (typeof WeixinJSBridge !== 'undefined') {
                WeixinJSBridge.invoke('getNetworkType', {}, run);
            } else {
                document.addEventListener('WeixinJSBridgeReady', function () {
                    try {
                        WeixinJSBridge.invoke('getNetworkType', {}, run);
                    } catch (e) {
                        run();
                    }
                }, false);
            }
        } catch (e) {}

        window.addEventListener('pageshow', run);
        setTimeout(run, 100);
        setTimeout(run, 500);
        setTimeout(run, 1500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        enforceDemoHiddenButtons();
        syncTemplateDataToStorage();
        initOuterMusic();
        bindIframeLoad();
        bindMessageBridge();
        bindPlaybackLifecycle();
        initIframe();
        bindOpenBtn();
        replayEarlyMeteorOpen?.(triggerOpenAction);
        bindH5MakeLink();
        bindMusicBtn();
        bindVideoBlessing();
        bindWeChatForceAutoPlay();

        const inMiniProgramEnv = await detectMiniProgramEnv();

        if (inMiniProgramEnv) {
            showMiniProgramButtons();
        } else {
            showH5Buttons();
        }

        if (window.templateData && window.templateData.nid) {
            reportPageView(window.templateData.nid);
        }
    });
</script>
